<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Store</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:#0b0f19; color:#e4e4e7; }
  header { display:flex; align-items:center; justify-content:space-between;
           padding:16px 24px; border-bottom:1px solid #1c2438; position:sticky; top:0;
           background:#0b0f19; }
  .logo { font-weight:700; font-size:20px; letter-spacing:-.5px; }
  .logo b { color:#34d399; }
  .cart { display:flex; align-items:center; gap:8px; background:#12182a;
          border:1px solid #253049; border-radius:999px; padding:8px 14px; font-size:14px; }
  #cart-count { min-width:20px; text-align:center; font-weight:700; color:#34d399; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
          gap:16px; padding:24px; max-width:900px; margin:0 auto; }
  .card { background:#12182a; border:1px solid #253049; border-radius:16px; padding:16px; }
  .thumb { height:96px; border-radius:12px; background:linear-gradient(135deg,#1b2440,#243456);
           display:flex; align-items:center; justify-content:center; font-size:38px; margin-bottom:12px; }
  .title { font-weight:600; font-size:15px; margin:0 0 4px; }
  .price { color:#8b8b95; font-size:13px; margin:0 0 12px; }
  button { width:100%; padding:10px; border:0; border-radius:10px; background:#34d399;
           color:#08130d; font-weight:600; cursor:pointer; font-size:14px; }
  button:active { transform:scale(.98); }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#12182a; border:1px solid #34d399; color:#e4e4e7; padding:10px 18px;
           border-radius:12px; font-size:14px; opacity:0; transition:.25s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
  <header>
    <div class="logo">Nexus<b>Store</b></div>
    <div class="cart">🛒 Cart <span id="cart-count">0</span></div>
  </header>
  <div class="grid">
    <div class="card"><div class="thumb">🎧</div><p class="title">Wireless Headphones</p><p class="price">$129</p><button data-item="Wireless Headphones">Add to Cart</button></div>
    <div class="card"><div class="thumb">⌨️</div><p class="title">Mechanical Keyboard</p><p class="price">$89</p><button data-item="Mechanical Keyboard">Add to Cart</button></div>
    <div class="card"><div class="thumb">🖱️</div><p class="title">Ergonomic Mouse</p><p class="price">$49</p><button data-item="Ergonomic Mouse">Add to Cart</button></div>
    <div class="card"><div class="thumb">🖥️</div><p class="title">4K Monitor</p><p class="price">$399</p><button data-item="4K Monitor">Add to Cart</button></div>
  </div>
  <div id="toast"></div>
  <script>
    var count = 0;
    var badge = document.getElementById('cart-count');
    var toast = document.getElementById('toast');
    document.querySelectorAll('button[data-item]').forEach(function (b) {
      b.addEventListener('click', function () {
        count++;
        badge.textContent = count;
        toast.textContent = 'Added “' + b.dataset.item + '” to cart';
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1400);
      });
    });
  </script>
</body>
</html>
