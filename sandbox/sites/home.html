<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Start</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0b0f19; color:#e4e4e7; min-height:100vh;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; }
  h1 { font-size:34px; margin:0 0 6px; letter-spacing:-1px; }
  .sub { color:#8b8b95; margin:0 0 34px; font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(3, 150px); gap:18px; }
  a.card { text-decoration:none; color:#e4e4e7; background:#12182a; border:1px solid #253049;
           border-radius:18px; padding:22px 16px; text-align:center; transition:.15s;
           display:flex; flex-direction:column; align-items:center; gap:10px; }
  a.card:hover { border-color:#34d399; transform:translateY(-3px); }
  .ico { width:46px; height:46px; border-radius:12px; background:#1b2440; display:flex;
         align-items:center; justify-content:center; font-size:24px; }
  .name { font-weight:600; font-size:14px; }
  .foot { margin-top:36px; font-size:12px; color:#5b6472; }
</style>
</head>
<body>
  <h1>Nexus Start</h1>
  <p class="sub">A tiny demo web to drive. Pick a site — or let the AI do it.</p>
  <div class="grid">
    <a class="card" href="search.html"><div class="ico">🔎</div><div class="name">NexusFind</div></a>
    <a class="card" href="shop.html"><div class="ico">🛍️</div><div class="name">Nexus Store</div></a>
    <a class="card" href="login.html"><div class="ico">🔐</div><div class="name">Sign In</div></a>
  </div>
  <div class="foot">These pages are real DOM. The bridge extension clicks and types on them for real.</div>
</body>
</html>
