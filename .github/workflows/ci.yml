name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r license_server/requirements.txt

      - name: License server tests
        run: python -m unittest discover -s license_server/tests -v

      - name: Extension entitlement tests
        run: node --test extension/license.test.js
