<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In • Nexus</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:#0b0f19; color:#e4e4e7; min-height:100vh; display:flex;
         align-items:center; justify-content:center; padding:24px; }
  .box { width:100%; max-width:340px; background:#12182a; border:1px solid #253049;
         border-radius:20px; padding:28px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:#8b8b95; font-size:13px; margin:0 0 22px; }
  label { display:block; font-size:12px; color:#9aa2b1; margin:0 0 6px; }
  input { width:100%; padding:12px 14px; border-radius:11px; border:1px solid #253049;
          background:#0b0f19; color:#e4e4e7; font-size:14px; margin-bottom:16px; }
  input:focus { outline:2px solid #34d399; border-color:#34d399; }
  button { width:100%; padding:12px; border:0; border-radius:11px; background:#34d399;
           color:#08130d; font-weight:700; font-size:15px; cursor:pointer; }
  #welcome { display:none; text-align:center; }
  #welcome .tick { font-size:44px; }
  #welcome h2 { margin:8px 0 4px; }
  #welcome p { color:#8b8b95; font-size:13px; margin:0; }
</style>
</head>
<body>
  <div class="box">
    <div id="form-view">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your Nexus account</p>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="off" placeholder="you@example.com">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••">
        <button type="submit">Sign In</button>
      </form>
    </div>
    <div id="welcome">
      <div class="tick">✅</div>
      <h2 id="welcome-name">Signed in</h2>
      <p>The AI filled this form and submitted it for you.</p>
    </div>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('username').value.trim() || 'friend';
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('welcome-name').textContent = 'Welcome, ' + u;
      document.getElementById('welcome').style.display = 'block';
    });
  </script>
</body>
</html>
